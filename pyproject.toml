[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "devialet-air"
version = "0.1.0"
description = "Experimental portable Devialet Expert AIR transport"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = []

[project.urls]
Repository = "https://github.com/RZomerman/ma-devialet-expert"
Issues = "https://github.com/RZomerman/ma-devialet-expert/issues"
Documentation = "https://github.com/RZomerman/ma-devialet-expert/blob/main/INSTALL.md"

[project.optional-dependencies]
dev = ["ruff>=0.11", "mypy>=1.15"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
devialet_air = ["py.typed"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/devialet_air"]
